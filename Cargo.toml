[workspace]
resolver = "2"
members = [
    "prog/engine/core",
    "prog/engine/memory",
    "prog/engine/math",
    "prog/engine/drv",
    "prog/engine/render",
    "prog/engine/scene",
    "prog/engine/plugin",
    "prog/tools/shader-build",
    "prog/engine/app",
    "prog/engine/editor",
    "prog/samples/hello-triangle",
    "prog/samples/editor",
    "prog/samples/gates/bindless",
    "prog/samples/gates/pbr-grid",
    "prog/samples/gates/clouds",
    "prog/samples/gates/csm",
    "prog/samples/gates/ecs",
    "prog/samples/gates/fog",
    "prog/samples/gates/furnace",
    "prog/samples/gates/heightquery",
    "prog/samples/gates/ibl",
    "prog/samples/gates/instances",
    "prog/samples/gates/lights",
    "prog/samples/gates/sky",
    "prog/samples/gates/taa",
    "prog/samples/gates/terrain",
    "prog/samples/gates/veg",
    "prog/samples/gates/rain",
    "prog/samples/gates/water",
    "prog/samples/storm",
    "prog/samples/sponza",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
bevy_ecs = "0.19"
harpia-scene = { path = "prog/engine/scene" }
harpia-shader-build = { path = "prog/tools/shader-build" }
harpia-core = { path = "prog/engine/core" }
harpia-memory = { path = "prog/engine/memory" }
harpia-math = { path = "prog/engine/math" }
harpia-rhi = { path = "prog/engine/drv" }
harpia-render = { path = "prog/engine/render" }
harpia-plugin = { path = "prog/engine/plugin" }
harpia-app = { path = "prog/engine/app" }
harpia-editor = { path = "prog/engine/editor" }

glam = { version = "0.29", features = ["serde"] }
bevy_reflect = "0.19"
serde = { version = "1", features = ["derive"] }
ron = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
# Portal XDG, sem a feature `wayland` (este host é X11 e não tem wayland-client.pc).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
libloading = "0.8"
mimalloc = "0.1"
bumpalo = "3"
ash = "0.38"
ash-window = "0.13"
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }
raw-window-handle = "0.6"
winit = "0.30"
# Overlay / editor. `egui-wgpu` is out (D0). The Vulkan draw lives in `harpia-rhi`.
egui = "0.33"
egui-winit = "0.33"
egui-ash-renderer = { version = "0.11", default-features = false, features = ["dynamic-rendering"] }
bitflags = "2"
# Fase 6, §14.1: bake de noise e geração de mips. **Não** para o frame graph,
# que é single-thread por decisão (D0).
rayon = "1"
gltf = { version = "1.4", features = ["import"] }
image = "0.25"
